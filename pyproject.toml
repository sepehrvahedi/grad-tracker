[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grad-tracker"
version = "0.1.0"
description = "Every UK graduate role in one list, ranked against your CV. Local, free, no API key."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Sepehr Vahedi" }]
keywords = ["graduate jobs", "job search", "uk", "cv", "ranking"]
dependencies = ["pyyaml>=6.0", "requests>=2.31", "pypdf>=4.0"]

[project.optional-dependencies]
llm = ["openai>=1.40"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/sepehrvahedi/grad-tracker"
Issues = "https://github.com/sepehrvahedi/grad-tracker/issues"

[project.scripts]
grad-tracker = "gradtracker.cli:main"

[tool.setuptools]
packages = ["gradtracker"]

[tool.setuptools.package-data]
gradtracker = ["web/*", "defaults/*.yaml", "examples/*.pdf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
markers = ["live: talks to the real job boards (run with: pytest -m live)"]

  # quant and trading
  - {name: Jane Street, ats: greenhouse, board: janestreet}
  - {name: DRW, ats: greenhouse, board: drweng}
  - {name: IMC Trading, ats: greenhouse, board: imc}
  - {name: Squarepoint Capital, ats: greenhouse, board: squarepointcapital}
  - {name: Tower Research Capital, ats: greenhouse, board: towerresearchcapital}
  - {name: Man Group, ats: greenhouse, board: mangroup}
  - {name: Hudson River Trading, ats: greenhouse, board: wehrtyou}
  - {name: Jump Trading, ats: greenhouse, board: jumptrading}
  - {name: Optiver, ats: greenhouse, board: optiverus}
  - {name: Five Rings, ats: greenhouse, board: fiveringsllc}
  - {name: XTX Markets, ats: greenhouse, board: xtxmarketstechnologies}
  - {name: Winton, ats: greenhouse, board: winton}
  - {name: Xantium, ats: greenhouse, board: xantium}
  - {name: Mako Trading, ats: greenhouse, board: mako}
  - {name: Quadrature, ats: ashby, board: quadrature}
  # tech and AI
  - {name: Palantir, ats: lever, board: palantir}
  - {name: Stripe, ats: greenhouse, board: stripe}
  - {name: Monzo, ats: greenhouse, board: monzo}
  - {name: Wise, ats: greenhouse, board: wise}
  - {name: Cloudflare, ats: greenhouse, board: cloudflare}
  - {name: Datadog, ats: greenhouse, board: datadog}

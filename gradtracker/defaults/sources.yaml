# jobs.ac.uk: research, data and scientific-computing roles at universities and institutes.
jobs_ac_uk:
  queries:
    - data scientist
    - machine learning
    - scientific machine learning
    - physics data
    - research software engineer
    - computational physics
    - quantum computing
    - graduate scientist

# Graduate job boards. Each one's robots.txt allows these pages; set enabled: false to switch one off.
# Gradcracker: search paths from gradcracker.com/search/... (graduate jobs only; 20 per page).
gradcracker:
  max_pages: 4
  searches:
    - technology-it/software-systems-graduate-jobs
    - technology-it/ai-machine-learning-graduate-jobs
    - technology-it/data-science-graduate-jobs

# TARGETjobs: graduate jobs in these sectors whose deadline hasn't passed.
targetjobs:
  sectors: [Software engineering, Data science, Technology, Fintech, Web development]

# Higherin (formerly RateMyPlacement): graduate jobs by role slug, from higherin.com/search-jobs/graduates/<slug>.
higherin:
  roles: [software-engineering, data-science, information-technology]

# SheCanCode job board (mixed seniority, so only graduate / junior / early-career UK roles are kept).
shecancode:
  max_pages: 5

# Adzuna UK job search (optional). Free keys at https://developer.adzuna.com, then add
# ADZUNA_APP_ID=... and ADZUNA_APP_KEY=... to .env. Uses the "graduate jobs" category.
adzuna:
  queries:
    - graduate data scientist
    - graduate machine learning
    - graduate physics
    - graduate software engineer
    - graduate quantitative

# Where the tracker looks for graduate roles. To change it, copy this file to sources.yaml in your
# grad-tracker folder, edit the copy, then click "Refresh".
# Positions found in several places are merged into one (see applier/dedupe.py).

# Trackr (the-trackr.com): curated UK graduate programmes with deadlines, visa and cover-letter details.
# OFF by default: the robots.txt of Trackr's API asks automated clients to stay away. Only switch it on
# if Trackr has told you that is fine for your use.
trackr:
  enabled: false
  industries: [Tech, Finance, Engineering]

# Company job boards with public APIs (Greenhouse, Lever, Ashby). Only UK roles are kept.
# By default only graduate / new-grad / junior / 2027 roles are kept; all_levels: true keeps every
# non-senior role (for small AI and science teams that rarely label roles as graduate).

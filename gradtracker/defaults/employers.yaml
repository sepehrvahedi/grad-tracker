# Employer tiers for the local scorer (no LLM). Edit freely; the next refresh re-scores.
#
# tier sets career value (reputation, learning, pay) and selectivity (how hard it is to get in):
#   elite     - hires well under 1% of applicants; top pay and reputation
#   top       - very selective, excellent reputation
#   strong    - well-known, good programmes
#   (anything not listed is "standard", unless Trackr's category says otherwise)
#   weak      - train-and-place schemes or roles with little engineering growth
# fields are matched against each person's `employer_fields` bonuses in person.yaml
# (quant, bigtech, ai, science, bank, fintech, energy, defence, consulting, academia).

